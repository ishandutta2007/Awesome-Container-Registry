<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes dashMove{0%{stroke-dashoffset:100}}@keyframes floatBox{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes orbitPulse{0%{r:4px;opacity:.4}50%{r:7px;opacity:1}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:52px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulsing-bg{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.moving-line{stroke-dasharray:12,12;animation:dashMove 4s linear infinite}.floating-card-1{animation:floatBox 5s ease-in-out infinite}.floating-card-2{animation:floatBox 6s ease-in-out infinite 1s}.floating-card-3{animation:floatBox 5.5s ease-in-out infinit