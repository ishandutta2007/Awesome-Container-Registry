<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes orbitPulse {
      0%, 100% { r: 4px; opacity: 0.4; }
      50% { r: 7px; opacity: 1; }
    }

    .pulsing-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .moving-line {
      stroke-dasharray: 12, 12;
      animation: dashMove 4s linear infinite;
    }
    .floating-card-1 {
      animation: floatBox 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatBox 6s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: floatBox 5.5s ease-in-out infinite 2s;
    }
    .dot-node {
      animation: orbitPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Background Dynamic Glowing Orbs -->
  <circle cx="150" cy="100" r="180" fill="#0284c7" opacity="0.15" filter="url(#softGlow)" class="pulsing-bg" />
  <circle cx="1050" cy="300" r="220" fill="#6366f1" opacity="0.18" filter="url(#softGlow)" class="pulsing-bg" />
  <circle cx="900" cy="80" r="140" fill="#a855f7" opacity="0.12" filter="url(#softGlow)" class="pulsing-bg" />

  <!-- Decorative Tech Grid & Connecting Network Lines (Background) -->
  <g opacity="0.25">
    <line x1="100" y1="320" x2="1100" y2="320" stroke="#334155" stroke-width="1.5" />
    <line x1="850" y1="50" x2="850" y2="350" stroke="#334155" stroke-width="1.5" />
    <line x1="1000" y1="50" x2="1000" y2="350" stroke="#334155" stroke-width="1.5" />

    <!-- Animated Flow Lines -->
    <path d="M 750 320 C 850 320, 850 160, 950 160" fill="none" stroke="#38bdf8" stroke-width="2" class="moving-line" />
    <path d="M 800 240 C 900 240, 920 100, 1050 100" fill="none" stroke="#818cf8" stroke-width="2" class="moving-line" />
  </g>

  <!-- Decorative Background Pill / Node Badges (Kept behind foreground text) -->
  <g class="floating-card-1">
    <rect x="850" y="90" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="875" cy="115" r="5" fill="#38bdf8" class="dot-node" />
    <text x="895" y="120" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">OCI Spec 1.1</text>
  </g>

  <g class="floating-card-2">
    <rect x="780" y="170" width="200" height="50" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="805" cy="195" r="5" fill="#818cf8" class="dot-node" />
    <text x="825" y="200" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Harbor &amp; Zot</text>
  </g>

  <g class="floating-card-3">
    <rect x="880" y="250" width="210" height="50" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="905" cy="275" r="5" fill="#c084fc" class="dot-node" />
    <text x="925" y="280" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Docker / GHCR / ECR</text>
  </g>

  <!-- Container Icon Graphic (Left Side Accent) -->
  <g transform="translate(80, 110)">
    <!-- Outer Container Box -->
    <rect x="0" y="0" width="70" height="70" rx="14" fill="url(#accentGrad)" opacity="0.9" filter="url(#glow)" />
    <!-- Inner Container Grid Pattern -->
    <rect x="12" y="16" width="18" height="15" rx="3" fill="#0f172a" />
    <rect x="38" y="16" width="18" height="15" rx="3" fill="#0f172a" />
    <rect x="12" y="38" width="18" height="15" rx="3" fill="#0f172a" />
    <rect x="38" y="38" width="18" height="15" rx="3" fill="#0f172a" />
  </g>

  <!-- Main Foreground Header & Subtitle (Always Sharp & Unobscured) -->
  <g transform="translate(175, 135)">
    <!-- Top Pill Category -->
    <rect x="0" y="-32" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="-13" class="badge-text">📦 CLOUD-NATIVE &amp; OCI</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="35" class="title">Awesome Container Registry</text>

    <!-- Gradient Bar Divider -->
    <rect x="0" y="55" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="92" class="subtitle">Curated Guide to SaaS Platforms, Open-Source Projects &amp; OCI Storage</text>
  </g>
</svg>
